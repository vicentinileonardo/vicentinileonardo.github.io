<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
<meta charset="utf-8">
<script>
/* Old CV filename (renamed July 2026): GitHub Pages can't redirect server-side, so send it on from here. */
(function () {
  var p = location.pathname.toLowerCase();
  if (p === '/cv_leonardo_vicentini_msc_software_engineer.pdf') location.replace('/cv_leonardo_vicentini.pdf');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>No data :: {{ .Site.Title }}</title>
<link rel="icon" href="{{ "favicon.svg" | absURL }}" type="image/svg+xml">
<link rel="icon" href="{{ "favicon.ico" | absURL }}" sizes="any">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | absURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--grey:#c0c0c0;--sel:#3cdcff;--dim:#8b93a6;--osd:"Arimo",Arial,"Helvetica Neue",Helvetica,sans-serif;--mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--grey);font-family:var(--osd);overflow:hidden;
  background-image:radial-gradient(120% 70% at 50% 115%,rgba(30,70,140,.38),transparent 60%),radial-gradient(60% 40% at 50% 45%,rgba(40,60,110,.12),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 80px rgba(0,0,0,.7)}
main{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center}
.box{display:grid;gap:14px;justify-items:center}
h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,40px);letter-spacing:.02em;color:var(--grey);text-shadow:0 0 12px rgba(160,190,255,.25);animation:fade 1.2s ease-out both}
.path{font:13px/1.4 var(--mono);color:var(--dim);max-width:min(90vw,520px);overflow-wrap:anywhere}
.path b{font-weight:400;color:var(--grey)}
nav{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));display:flex;gap:28px;flex-wrap:wrap}
nav a{display:flex;align-items:center;gap:6px;color:var(--grey);text-decoration:none;font-size:20px;padding:4px 2px}
nav a:hover,nav a:focus-visible{color:#fff}
nav a:focus-visible{outline:2px solid #fff;outline-offset:3px}
nav svg{width:25px;height:24px;flex:none}
kbd{font:11px/1 var(--mono);color:#cfcfcf;border:1px solid rgba(220,220,220,.55);border-bottom-width:2px;border-radius:3px;padding:1px 4px;margin-left:4px}
@media (hover:none){kbd{display:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<main>
  <div class="box">
    <h1>No data.</h1>
    <p class="path">Nothing is saved at <b id="where">this address</b>.</p>
  </div>
</main>
<nav aria-label="Where to go">
  <a href="{{ "/" | absURL }}" id="home"><svg viewBox="0 0 25 24" aria-hidden="true"><path d="M5.5 5l14 14M19.5 5l-14 14" stroke="#7777bb" stroke-width="2.6"/></svg>Main menu<kbd>Enter</kbd></a>
  <a href="{{ "/" | absURL }}" id="back"><svg viewBox="0 0 25 24" aria-hidden="true"><circle cx="12.5" cy="12" r="6" fill="none" stroke="#ff5c70" stroke-width="2.2"/></svg>Back<kbd>Esc</kbd></a>
</nav>
<script>
(function () {
  var w = document.getElementById('where');
  try { w.textContent = decodeURI(location.pathname); } catch (e) { w.textContent = location.pathname; }
  var home = document.getElementById('home').href;
  var back = function (e) {
    if (e) e.preventDefault();
    if (history.length > 1 && document.referrer) history.back(); else location.href = home;
  };
  document.getElementById('back').addEventListener('click', back);
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape' || e.key === 'Backspace') back(e);
    else if (e.key === 'Enter' && !(document.activeElement && document.activeElement.id === 'back')) { e.preventDefault(); location.href = home; }
  });
})();
</script>
</body>
</html>
